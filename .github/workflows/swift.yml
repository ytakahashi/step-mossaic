name: Swift

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  XCODE_APP: /Applications/Xcode_26.3.app

jobs:
  lint-and-build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Lint
        run: |
          xcrun swift-format lint --recursive --parallel --strict \
            StepMossaic/StepMossaic \
            StepMossaic/StepMossaicTests \
            StepMossaic/StepMossaicUITests \
            Packages/StepMossaicDomain

      - name: Release build
        run: |
          xcodebuild build \
            -project StepMossaic/StepMossaic.xcodeproj \
            -scheme StepMossaic \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" | xcbeautify

  domain-app-unit-tests:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Run domain tests
        run: swift test --package-path Packages/StepMossaicDomain

      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.name | test("^iPhone")) | .udid' \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run app unit tests
        run: |
          xcodebuild test \
            -project StepMossaic/StepMossaic.xcodeproj \
            -scheme StepMossaicUnitTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" | xcbeautify

  # Manual-only: measured wall-clock time is too costly to run on every push/PR.
  # Trigger manually when UI-test coverage needs checking, not as a required PR check.
  app-ui-tests:
    if: ${{ github.event_name == 'workflow_dispatch' }}

    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.name | test("^iPhone")) | .udid' \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run app UI tests
        run: |
          xcodebuild test \
            -project StepMossaic/StepMossaic.xcodeproj \
            -scheme StepMossaicUITests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" | xcbeautify
