name: Swift

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  XCODE_APP: /Applications/Xcode_26.3.app

jobs:
  lint-and-build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Select Xcode
      run: sudo xcode-select -s "$XCODE_APP"

    - name: Lint
      run: |
        xcrun swift-format lint --recursive --parallel --strict \
          StepMossaic/StepMossaic \
          StepMossaic/StepMossaicTests \
          StepMossaic/StepMossaicUITests \
          Packages/StepMossaicDomain

    - name: Release build
      run: |
        xcodebuild build \
          -project StepMossaic/StepMossaic.xcodeproj \
          -scheme StepMossaic \
          -configuration Release \
          -destination "generic/platform=iOS Simulator" | xcbeautify

  domain-app-unit-tests:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Select Xcode
      run: sudo xcode-select -s "$XCODE_APP"

    - name: Run domain tests
      run: swift test --package-path Packages/StepMossaicDomain

    - name: Run app unit tests
      run: |
        xcodebuild test \
          -project StepMossaic/StepMossaic.xcodeproj \
          -scheme StepMossaicUnitTests \
          -destination "platform=iOS Simulator,name=iPhone 17" | xcbeautify
