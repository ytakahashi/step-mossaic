name: Swift

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  # Packages/StepMossaicDomain requires swift-tools-version 6.3 / macOS 26 platform,
  # which macos-latest runners do not select by default.
  XCODE_APP: /Applications/Xcode_26.3.app

jobs:
  domain-and-lint:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Select Xcode
      run: sudo xcode-select -s "$XCODE_APP"

    - name: Lint
      run: |
        xcrun swift-format lint --recursive --parallel --strict \
          StepMossaic/StepMossaic \
          StepMossaic/StepMossaicTests \
          StepMossaic/StepMossaicUITests \
          Packages/StepMossaicDomain

    - name: Run domain tests
      run: swift test --package-path Packages/StepMossaicDomain

  app-unit:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Select Xcode
      run: sudo xcode-select -s "$XCODE_APP"

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Run app unit tests
      run: |
        xcodebuild test \
          -project StepMossaic/StepMossaic.xcodeproj \
          -scheme StepMossaicUnitTests \
          -destination "platform=iOS Simulator,name=iPhone 17" \
          SWIFT_SUPPRESS_WARNINGS=NO \
          OTHER_SWIFT_FLAGS="-Xfrontend -warn-long-function-bodies=50 -Xfrontend -warn-long-expression-type-checking=50"

  release-build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Select Xcode
      run: sudo xcode-select -s "$XCODE_APP"

    - name: Release build
      run: |
        xcodebuild build \
          -project StepMossaic/StepMossaic.xcodeproj \
          -scheme StepMossaic \
          -configuration Release \
          -destination "generic/platform=iOS Simulator" \
          SWIFT_SUPPRESS_WARNINGS=NO \
          OTHER_SWIFT_FLAGS="-Xfrontend -warn-long-function-bodies=50 -Xfrontend -warn-long-expression-type-checking=50"
