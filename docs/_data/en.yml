privacy_heading: "Privacy Policy"
privacy_updated: "Last updated: July 11, 2026"
privacy_intro: >-
  Step Mossaic is designed so your health data never leaves your device.
  This section explains what the app accesses and how it's used.
privacy_sections:
  - heading: "Data the app accesses"
    body: >-
      Step count data, read from Apple Health (HealthKit), with your
      explicit permission. The app requests read-only access — it never
      writes to Health, and never requests any other Health data type
      (heart rate, sleep, workouts, etc).
  - heading: "How your data is used"
    body: >-
      Step counts are used only to render the heatmap and the monthly
      marimo growth visualization inside the app. A local cache of daily
      step totals is stored on your device and never leaves it — Step
      Mossaic has no servers, performs no network requests, and includes no
      analytics, advertising, or crash-reporting SDKs. This local cache is
      never uploaded to iCloud or any other cloud service.
  - heading: "Sharing with third parties"
    body: >-
      Step Mossaic does not share, sell, transmit, or otherwise disclose
      your Health data to any third party, for any purpose, including
      advertising or analytics. Step Mossaic does not include third-party
      analytics, advertising, tracking, or data-collection SDKs.
  - heading: "Your controls"
    body: >-
      You can grant or revoke the app's access to Health data at any time
      from the Health app. Inside the app's Settings tab, Rebuild cache
      deletes the app's local copy of your step history and re-reads it
      from Health — this does not affect the data stored in Health itself.
      Deleting the app removes its local cache entirely. This does not affect
      the data stored in Health as well.
  - heading: "Local cache retention"
    body: >-
      Cached daily step totals and monthly marimos remain on your device until
      you rebuild the cache or delete the app. Revoking Health access prevents
      future reads but does not automatically delete data already cached by
      Step Mossaic.
  - heading: "Changes to this policy"
    body: >-
      If this policy changes, the "Last updated" date above will be
      revised. Any material change will be reflected here before it takes
      effect.
privacy_contact: >-
  Questions about this policy can be sent to: yt01tc@gmail.com

