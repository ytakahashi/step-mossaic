hero_title: "Step Mossaic"
hero_tagline: >-
  Your daily steps, growing into something you can look back on.

about_heading: "What it does"
about_body: >-
  Step Mossaic reads your step count from Apple Health and turns it into two
  things: a calm heatmap of your daily rhythm, and a marimo that grows through
  the month based on how you walked.

features:
  - title: "A heatmap of your rhythm"
    swatch: "#3d7a42"
    body: >-
      Each day fills in based on your steps relative to the period you're
      viewing — no fixed daily goals, and no comparisons to other people.
  - title: "A marimo that grows with you"
    swatch: "#5fa35a"
    body: >-
      A new marimo starts small on the first of each month. Its size, color,
      and shape shift with how much — and how steadily — you walked that
      month.
  - title: "A shelf of every month"
    swatch: "#a9d9a0"
    body: >-
      After the month ends, its marimo settles onto the shelf and becomes a
      quiet record of how the month felt.

